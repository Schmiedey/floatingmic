<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Shot · Dictate</title>
    <link rel="stylesheet" href="../../overlay.css" />
    <link rel="stylesheet" href="shot.css" />
  </head>
  <body class="shot">
    <div class="browser">
      <div class="chrome">
        <span></span><span></span><span></span>
        <div class="omni">mail.internal / inbox</div>
      </div>
      <div class="page">
        <p class="eyebrow">Inbox</p>
        <h1>Search mail</h1>
        <input class="search" value="quarterly budget recap " />
        <p class="hint">Hold Control · speak · release</p>
      </div>
      <div id="voice-anywhere-host">
        <div class="va-overlay va-visible va-state-listening va-speaking" role="status">
          <div class="va-meter" aria-hidden="true">
            <span style="transform: scaleY(0.45)"></span>
            <span style="transform: scaleY(0.82)"></span>
            <span style="transform: scaleY(1)"></span>
            <span style="transform: scaleY(0.7)"></span>
            <span style="transform: scaleY(0.38)"></span>
            <span style="transform: scaleY(0.55)"></span>
            <span style="transform: scaleY(0.22)"></span>
          </div>
          <div class="va-copy">
            <span class="va-kicker">Listening</span>
            <span class="va-label">quarterly budget recap</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
