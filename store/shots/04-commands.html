<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Shot · Commands</title>
    <link rel="stylesheet" href="shot.css" />
  </head>
  <body class="shot shot-commands">
    <p class="kicker">Voice commands</p>
    <h1>Speak the punctuation.</h1>
    <ul>
      <li><kbd>new line</kbd><span>Start the next line</span></li>
      <li><kbd>period</kbd><span>End the sentence</span></li>
      <li><kbd>comma</kbd><span>Pause, then continue</span></li>
      <li><kbd>scratch that</kbd><span>Undo the last dictation</span></li>
    </ul>
  </body>
</html>
