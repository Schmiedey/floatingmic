<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Shot · Anywhere</title>
    <link rel="stylesheet" href="shot.css" />
  </head>
  <body class="shot shot-grid">
    <header>
      <p class="kicker">Works in the field you already clicked</p>
      <h1>Search. Mail. Tickets. Notes.</h1>
    </header>
    <div class="cards">
      <article><label>Search</label><div class="fake-input">find last quarter’s invoices</div></article>
      <article><label>Mail</label><div class="fake-input">Hi Maya — can we move Tuesday?</div></article>
      <article><label>Issue</label><div class="fake-input">Login fails after SSO timeout</div></article>
      <article><label>Doc</label><div class="fake-input">Agenda: hiring, budget, launch</div></article>
    </div>
    <p class="foot">Hold Control. Speak. The text lands at the cursor.</p>
  </body>
</html>
